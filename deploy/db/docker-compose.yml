services:
  mysql:
    image: mysql:8.4
    container_name: policy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    # 사설 IP 에만 연다. 보안 목록(10.0.0.0/16)과 함께 두 겹으로 막는다 (D-026, 9/15 의도와 맞춤)
    ports:
      - "10.0.0.190:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 컨테이너 안 MySQL 클라이언트(mysqldump · mysql · mysqladmin)가 읽는 접속 정보 (12/4).
      # 비밀번호를 명령줄(-p)에 쓰면 ps 로 보이고 매번 경고가 남아서 옵션 파일로 옮겼다.
      # 이 파일은 서버의 ~/policy 에만 있고 리포에는 없다(.gitignore). 만드는 명령은 backup.sh 맨 위 설명 참고.
      # 파일이 없는 채로 기동하면 Docker 가 같은 이름의 빈 폴더를 만들어 접속이 실패하므로, 먼저 만든 뒤 올린다.
      - ./mysql-client.cnf:/root/.my.cnf:ro
    healthcheck:
      # 접속 정보는 /root/.my.cnf 에서 읽는다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
