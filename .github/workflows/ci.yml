name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트가 @SpringBootTest라 실제 DB가 필요하다.
    # GitHub Actions가 MySQL 컨테이너를 띄워주고, 끝나면 알아서 정리한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: policy
          MYSQL_USER: policy
          MYSQL_PASSWORD: policypw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/policy?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MYSQL_USER: policy
          MYSQL_PASSWORD: policypw

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # ---------- CD 1단계: 이미지 빌드 + 푸시 (D-013) ----------
  docker:
    # build(테스트)가 성공해야 실행된다. 실패하면 이 job은 건너뛴다.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # 비밀번호 대신 액세스 토큰으로 로그인한다. 토큰 값은 GitHub Secrets에만 있다.
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: lhjunkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v4

      # 커밋 SHA 40자 중 앞 7자를 이미지 태그로 쓴다. 예: 0f7465f
      - name: 태그 계산
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 러너가 x86이라 맥에서처럼 --platform linux/amd64 를 붙일 필요가 없다.
      - name: 이미지 빌드 + 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: lhjunkr/policy-match:${{ steps.tag.outputs.sha }}
          # 이미지 안에 커밋 7자리를 새겨 둔다. 서버의 /health 가 이 값을 보여 준다.
          build-args: APP_VERSION=${{ steps.tag.outputs.sha }}

  # ---------- CD 2단계: 서버 반영 (D-013) ----------
  deploy:
    # 이미지가 Docker Hub에 올라간 뒤에만 실행된다. docker job이 건너뛰어지면(PR 등) 이 job도 건너뛴다.
    needs: docker
    runs-on: ubuntu-latest
    # 머지가 연달아 일어나도 배포가 동시에 두 개 돌지 않게 한 줄로 세운다.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      # 배포 전용 열쇠와 서버 신원 정보를 러너에 파일로 꺼낸다. 값은 GitHub Secrets에만 있다.
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # 맥에서 손으로 치던 한 줄을 그대로 실행한다. deploy.sh가 실패하면(exit 1) 이 단계도 빨강이 된다.
      - name: 서버에서 deploy.sh 실행
        run: ssh -i ~/.ssh/deploy_key ubuntu@161.33.139.178 "cd ~/policy && ./deploy.sh ${GITHUB_SHA::7}"

      # 인터넷 바깥에서 공개 URL을 불러, 방금 배포한 커밋 7자리가 실제로 돌고 있는지 확인한다.
      - name: 공개 URL 확인
        run: |
          EXPECTED="\"version\":\"${GITHUB_SHA::7}\""
          for _ in $(seq 1 10); do
            BODY=$(curl -fs http://161.33.139.178:8080/health || true)
            echo "응답: ${BODY}"
            if [[ "$BODY" == *"$EXPECTED"* ]]; then
              echo "공개 URL 확인: ${GITHUB_SHA::7}"
              exit 0
            fi
            sleep 5
          done
          echo "공개 URL이 50초 안에 새 버전(${GITHUB_SHA::7})으로 응답하지 않음"
          exit 1
