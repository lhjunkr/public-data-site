name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트가 @SpringBootTest라 실제 DB가 필요하다.
    # GitHub Actions가 MySQL 컨테이너를 띄워주고, 끝나면 알아서 정리한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: policy
          MYSQL_USER: policy
          MYSQL_PASSWORD: policypw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/policy?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MYSQL_USER: policy
          MYSQL_PASSWORD: policypw

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # ---------- CD 1단계: 이미지 빌드 + 푸시 (D-013) ----------
  docker:
    # build(테스트)가 성공해야 실행된다. 실패하면 이 job은 건너뛴다.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # 비밀번호 대신 액세스 토큰으로 로그인한다. 토큰 값은 GitHub Secrets에만 있다.
      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: lhjunkr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v4

      # 커밋 SHA 40자 중 앞 7자를 이미지 태그로 쓴다. 예: 0f7465f
      - name: 태그 계산
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 러너가 x86이라 맥에서처럼 --platform linux/amd64 를 붙일 필요가 없다.
      - name: 이미지 빌드 + 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: lhjunkr/policy-match:${{ steps.tag.outputs.sha }}
