spring.application.name=policy-match

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/policy?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

spring.flyway.enabled=true

# --- 온통청년 청년정책 API ---
youth.api.base-url=https://www.youthcenter.go.kr/go/ythip/getPlcy
youth.api.key=${YOUTH_API_KEY:}
youth.api.page-size=100
youth.api.connect-timeout=3s
youth.api.read-timeout=10s

# --- 공공데이터포털 (12/9~, D-029) ---
# K-Startup · 마이홈 · 잡알리오 · 지방공공기관 채용이 같은 키를 쓴다(계정당 키 1개, 승인 · 트래픽은 API 별).
# "일반 인증키(Decoding)" 값을 넣는다. Encoding 값('%' 포함)은 두 번 인코딩되므로 호출 전에 막는다.
data-go-kr.key=${DATA_GO_KR_KEY:}
data-go-kr.connect-timeout=3s
data-go-kr.read-timeout=10s

# --- K-Startup 지원사업 공고 (12/9) ---
kstartup.api.base-url=https://apis.data.go.kr/B552735/kisedKstartupService02/getAnnouncementInformation02
kstartup.api.per-page=100

# --- 마이홈 공공주택 모집공고 (12/11) ---
# 공공임대 · 공공분양 두 기능을 모두 받는다. 기능별 일일 한도 1,000번(12/5), 지금 양은 5번 호출이다.
myhome.api.rental-url=https://apis.data.go.kr/1613000/HWSPR02/rsdtRcritNtcList
myhome.api.sale-url=https://apis.data.go.kr/1613000/HWSPR02/ltRsdtRcritNtcList
myhome.api.num-of-rows=100

# --- 관리용 엔드포인트 ---
admin.token=${ADMIN_TOKEN:}

# --- 매일 자동 갱신 (D-020) ---
# 초 분 시 일 월 요일. 한국 시간 매일 04:10 에 수집 → 성공하면 정규화. "-" 이면 끈다(테스트는 build.gradle 에서 끈다).
batch.daily-cron=0 10 4 * * *

# --- 의견 보내기 (D-024) ---
# 보관 기간(90일)이 지난 답장용 이메일을 지우는 시각. 한국 시간 매일 04:30 (04:10 매일 갱신이 끝난 뒤). "-" 이면 끈다.
feedback.purge-cron=0 30 4 * * *

# --- 프록시 뒤 실제 사용자 IP (D-025) ---
server.forward-headers-strategy=native

# --- 운영 알림 (D-026) ---
# 디스코드 웹훅 URL. 비어 있으면 알림을 끈다. URL 에 토큰이 들어 있어 값은 .env 에만 둔다.
alert.webhook-url=${ALERT_WEBHOOK_URL:}

# --- DB 연결 대기 (D-026) ---
# 연결을 얻을 때 최대 5초만 기다린다(기본 30초). DB 가 응답하지 않을 때 /health 와 사용자 요청이 30초씩 멈추지 않게 한다.
spring.datasource.hikari.connection-timeout=5000

# --- 검색(매칭) 요청 제한 (12/3) ---
# 같은 IP 에서 1분에 받는 매칭 요청 수. 부하 측정(k6)처럼 한 IP 에서 많이 보낼 때만 올린다.
# 운영 서버에서 바꾸려면 compose 의 app environment 에 RATELIMIT_MATCH_PER_MINUTE 를 추가해야 전달된다.
ratelimit.match.per-minute=${RATELIMIT_MATCH_PER_MINUTE:20}
