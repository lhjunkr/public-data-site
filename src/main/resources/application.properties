spring.application.name=policy-match

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/policy?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

spring.flyway.enabled=true

# --- 온통청년 청년정책 API ---
youth.api.base-url=https://www.youthcenter.go.kr/go/ythip/getPlcy
youth.api.key=${YOUTH_API_KEY:}
youth.api.page-size=100
youth.api.connect-timeout=3s
youth.api.read-timeout=10s

# --- 관리용 엔드포인트 ---
admin.token=${ADMIN_TOKEN:}
