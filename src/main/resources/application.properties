spring.application.name=policy-match

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/policy?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

spring.flyway.enabled=true

# --- 온통청년 청년정책 API ---
youth.api.base-url=https://www.youthcenter.go.kr/go/ythip/getPlcy
youth.api.key=${YOUTH_API_KEY:}
youth.api.page-size=100
youth.api.connect-timeout=3s
youth.api.read-timeout=10s

# --- 관리용 엔드포인트 ---
admin.token=${ADMIN_TOKEN:}

# --- 매일 자동 갱신 (D-020) ---
# 초 분 시 일 월 요일. 한국 시간 매일 04:10 에 수집 → 성공하면 정규화. "-" 이면 끈다(테스트는 build.gradle 에서 끈다).
batch.daily-cron=0 10 4 * * *

# --- 의견 보내기 (D-024) ---
# 보관 기간(90일)이 지난 답장용 이메일을 지우는 시각. 한국 시간 매일 04:30 (04:10 매일 갱신이 끝난 뒤). "-" 이면 끈다.
feedback.purge-cron=0 30 4 * * *
