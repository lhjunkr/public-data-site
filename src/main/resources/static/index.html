<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청년정책 매칭</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px;
         margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  h1 { font-size: 22px; }
  form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
         padding: 16px; background: #f5f5f5; border-radius: 8px; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  input, select { padding: 8px; font-size: 15px; border: 1px solid #ccc;
                  border-radius: 4px; }
  button { padding: 9px 20px; font-size: 15px; border: 0; border-radius: 4px;
           background: #1a5fb4; color: #fff; cursor: pointer; }
  #status { color: #666; font-size: 14px; }
  ul { list-style: none; padding: 0; }
  li { padding: 12px; border-bottom: 1px solid #eee; }
  .tag { display: inline-block; font-size: 12px; background: #e8f0fe;
         color: #1a5fb4; padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>

<h1>청년정책 매칭</h1>

<form id="search-form">
  <label>나이
    <input type="number" id="age" min="15" max="45" value="25" required>
  </label>
  <label>지역
    <select id="sido">
      <option value="">전체</option>
      <option>서울특별시</option><option>부산광역시</option>
      <option>대구광역시</option><option>인천광역시</option>
      <option>광주광역시</option><option>대전광역시</option>
      <option>울산광역시</option><option>세종특별자치시</option>
      <option>경기도</option><option>강원특별자치도</option>
      <option>충청북도</option><option>충청남도</option>
      <option>전북특별자치도</option><option>전라남도</option>
      <option>경상북도</option><option>경상남도</option>
      <option>제주특별자치도</option>
    </select>
  </label>
  <button type="submit">정책 찾기</button>
</form>

<p id="status"></p>
<ul id="result"></ul>

<script>
const form = document.getElementById('search-form');
const status = document.getElementById('status');
const result = document.getElementById('result');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const age = document.getElementById('age').value;
  const sido = document.getElementById('sido').value || '전체';

  status.textContent = '조회 중...';
  result.innerHTML = '';

  try {
    const response = await fetch('/api/v1/policies');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const policies = await response.json();

    status.textContent =
      `입력 조건: ${age}세 / ${sido} — 총 ${policies.length}건 (조건 필터는 9/22 연결 예정)`;

    for (const p of policies) {
      const li = document.createElement('li');
      li.innerHTML =
        `<strong>${p.title}</strong> <span class="tag">${p.categoryLarge ?? '미분류'}</span>`
        + `<br><small>${p.minAge ?? '-'}세 ~ ${p.maxAge ?? '-'}세 · ${p.policyNo}</small>`;
      result.appendChild(li);
    }
  } catch (error) {
    status.textContent = '오류: ' + error.message;
  }
});
</script>

</body>
</html>
