# 큐레이션 범위 설정 (D-011: 카테고리 범위는 설정으로 관리)
#
# 대분류가 아니라 중분류로 거른다. 수집한 2,842건을 집계해 보니 대분류가 두 세대로
# 섞여 있었다 — '복지문화'와 '금융･복지･문화', '참여권리'와 '참여･기반'이 같은 중분류를
# 나눠 갖고 있다. 대분류로 거르면 어느 쪽을 골라도 절반을 놓친다.
#
# 한글 값을 application.properties 가 아니라 이 파일에 둔 이유:
# .properties 는 인코딩 규약상 한글이 깨질 수 있지만 YAML 은 UTF-8 로 읽는다.
curation:
  medium-categories:
    - 취약계층 및 금융지원
    - 주택 및 거주지
    - 전월세 및 주거급여 지원
  limit: 30
  approved-status-code: "0044002"
