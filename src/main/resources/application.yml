# 한글 값을 application.properties 가 아니라 이 파일에 둔 이유:
# .properties 는 인코딩 규약상 한글이 깨질 수 있지만 YAML 은 UTF-8 로 읽는다.

# 서비스 대상 (D-007, D-018): 승인된 정책은 분류와 상관없이 모두 정규화한다. 건수 상한은 없다.
curation:
  approved-status-code: "0044002"

# 화면 분류 묶음표 (D-018, D-011: 설정으로 관리)
#  - 탭(대분류) → 칩(세부) → 원본 중분류 이름. 원본 중분류 하나는 칩 하나에만 속한다.
#  - 탭 순서 = 화면 순서. 칩은 탭마다 최대 3개, 100건 미만 덩어리는 가까운 칩에 합친다("기타" 없음).
#  - 원본 이름 비교는 공백과 가운뎃점(·, ･)을 무시한다. 이름이 바뀐 중분류는 옛 이름도 함께 적는다.
#  - open: false 인 탭의 칩만 가진 정책은 결과에 나오지 않는다. 일자리는 취업 상태 조건(D-021)과 함께 열었다.
#  - 근거: docs/quality-check.md 의 "분류 분포" (10/30, 3,763건)
#  - 묶음을 바꾸면 다음 정규화부터 반영된다.
category:
  tabs:
    - code: housing
      name: 주거
      open: true
      chips:
        - code: rent
          name: 전월세
          mediums: [전월세 및 주거급여 지원]
        - code: house
          name: 주택
          mediums: [주택 및 거주지, 기숙사]
        # 마이홈 공공주택 모집공고 전용 칩 (12/12, 사용자 결정). 온통청년 중분류는 넣지 않는다 — 정규화기가 직접 붙인다
        - code: public
          name: 공공임대·분양
          mediums: []
    - code: welfare
      name: 금융·복지
      open: true
      chips:
        - code: living
          name: 금융·생활비
          mediums: [취약계층 및 금융지원]
        - code: health
          name: 건강
          mediums: [건강]
        - code: culture
          name: 문화·예술
          mediums: [문화활동 및 생활지원, 문화활동, 예술인지원]
    - code: education
      name: 교육
      open: true
      chips:
        - code: tuition
          name: 교육비
          mediums: [교육비지원]
        - code: skills
          name: 역량개발·강의
          mediums: [미래역량강화, 온·오프라인교육, 온라인교육]
    - code: participation
      name: 참여
      open: true
      chips:
        - code: youth
          name: 청년참여
          mediums: [청년참여, 정책인프라구축]
        - code: exchange
          name: 국제교류
          mediums: [청년국제교류]
    - code: jobs
      name: 일자리
      open: true
      chips:
        - code: employment
          name: 취업
          mediums: [취업]
        - code: startup
          name: 창업
          mediums: [창업]
        - code: worker
          name: 재직자·권익
          mediums: [재직자, 권익보호]
    # 공공기관 채용 (12/13 잡알리오 데이터부터 넣고, 12/15 화면 편입 때 연다). 닫힌 탭의 칩만 가진 공고는 결과에 나오지 않는다(D-018).
    #  - 고용형태 칩: mediums 는 원본 고용형태 이름(잡알리오 hireTypeNmLst). 12/14 지방공공기관 이름(일반정규직 · 기간제 등)도 여기에 더한다.
    #  - entry 는 채용 구분에 '신입'이 있는 공고(신입 · 신입+경력)에 정규화기가 직접 붙인다. 원본 이름 매핑이 없다.
    #  - 칩이 5개라 D-018(탭당 3개)을 넘는다. 화면에 어떤 칩을 어떻게 보일지는 12/15에 정한다(10/30: 분류는 사용자가 나눈다).
    - code: recruit
      name: 공공기관 채용
      open: false
      chips:
        - code: regular
          name: 정규직
          mediums: [정규직]
        - code: indefinite
          name: 무기계약직
          mediums: [무기계약직]
        - code: intern
          name: 청년인턴
          mediums: ["청년인턴(체험형)", "청년인턴(채용형)"]
        - code: contract
          name: 비정규직
          mediums: [비정규직]
        - code: entry
          name: 신입 가능
          mediums: []

# 시도 이름 → 시도 코드 (D-029 ⑥, D-011: 설정으로 관리)
#  - 같은 시도가 출처마다 다르게 적혀 온다: 정식 이름 · 약칭 · 통합 전 이름. 여기에 모두 적는다.
#  - 첫 이름이 화면에 보이는 이름이다(GET /api/v1/regions/sido).
#  - 비교할 때 공백은 무시한다. 같은 이름이 두 시도에 들어가면 앱이 뜨지 않는다.
#  - nationwide 의 이름("전국")은 아래 모든 시도로 펼친다. K-Startup 공고의 59% (12/5).
#  - 근거: docs/sources/*.md 의 지역 분포 (11/25). 모르는 이름은 정규화 로그에 남는다.
sido:
  nationwide: [전국]
  regions:
    - code: "11"
      names: [서울, 서울특별시]
    - code: "12"
      names: [전남광주, 전남광주통합특별시, 광주, 광주광역시, 전남, 전라남도]
    - code: "26"
      names: [부산, 부산광역시]
    - code: "27"
      names: [대구, 대구광역시]
    - code: "28"
      names: [인천, 인천광역시]
    - code: "30"
      names: [대전, 대전광역시]
    - code: "31"
      names: [울산, 울산광역시]
    - code: "36"
      names: [세종, 세종특별자치시]
    - code: "41"
      names: [경기, 경기도]
    - code: "43"
      names: [충북, 충청북도]
    - code: "44"
      names: [충남, 충청남도]
    - code: "47"
      names: [경북, 경상북도]
    - code: "48"
      names: [경남, 경상남도]
    - code: "50"
      names: [제주, 제주특별자치도]
    - code: "51"
      names: [강원, 강원특별자치도, 강원도]
    - code: "52"
      names: [전북, 전북특별자치도, 전라북도]
